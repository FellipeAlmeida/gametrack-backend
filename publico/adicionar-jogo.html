<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <title>Adicionar jogo · checkpoint</title>
</head>

<body>
    <header class="header">
        <a class="logo" href="index.html">
            <span class="logo-icon">🎮</span>
            checkpoint
        </a>

        <nav class="nav">
            <a href="index.html">Avaliações</a>

            <a class="active" href="adicionar-jogo.html">
                Adicionar jogo
            </a>

            <a class="btn btn-primary" href="adicionar-avaliacao.html">
                + Avaliar um jogo
            </a>
        </nav>
    </header>

    <main class="page">
        <a class="back" href="index.html">
            ← Voltar para avaliações
        </a>

        <h1>Adicionar jogo</h1>

        <form class="form-card" id="form-jogo">
            <div class="form-head">
                <h2>Informações do jogo</h2>
                <span class="required-note">* Campo obrigatório</span>
            </div>

            <div class="field">
                <label for="titulo">Título do jogo <i>*</i></label>
                <input
                    class="input"
                    id="titulo"
                    name="titulo"
                    type="text"
                    placeholder="Ex.: Outer Wilds"
                    required
                >
            </div>

            <div class="field">
                <label for="descricao">Descrição</label>
                <textarea
                    class="input"
                    id="descricao"
                    name="descricao"
                    rows="4"
                    placeholder="Descreva o jogo..."
                ></textarea>
            </div>

            <div class="field">
                <label for="genero">Gênero</label>
                <input
                    class="input"
                    id="genero"
                    name="genero"
                    type="text"
                    placeholder="Ex.: Aventura e exploração"
                >
            </div>

            <div class="field">
                <label for="plataforma">Plataforma</label>
                <input
                    class="input"
                    id="plataforma"
                    name="plataforma"
                    type="text"
                    placeholder="Ex.: PC, PlayStation, Xbox"
                >
            </div>

            <p id="mensagem" role="status" aria-live="polite"></p>

            <div class="actions">
                <a class="btn" href="index.html">Cancelar</a>

                <button
                    class="btn btn-primary"
                    type="submit"
                >
                    + Adicionar jogo
                </button>
            </div>
        </form>
    </main>

    <script type="module" src="./adicionarJogo.js"></script>
</body>
</html>
